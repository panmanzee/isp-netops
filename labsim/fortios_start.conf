config system global
    set admintimeout 30
    set alias "FGT60F"
    set hostname "fw-edge"
    set timezone 26
end
config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping
        set alias "wan"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 192.168.20.1 255.255.255.0
        set allowaccess ping https ssh
        set alias "servers"
        set role lan
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.30.1 255.255.255.0
        set allowaccess ping
        set alias "dmz"
        set role dmz
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2lab0000000000000000000000000000000000000000000000000000
    next
end
config firewall address
    edit "servers-net"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "dmz-net"
        set subnet 192.168.30.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "servers-to-wan"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "servers-net"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "dmz-to-wan"
        set srcintf "port3"
        set dstintf "port1"
        set action accept
        set srcaddr "dmz-net"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set nat enable
    next
    edit 3
        set name "wan-to-dmz-web"
        set srcintf "port1"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "dmz-net"
        set schedule "always"
        set service "HTTPS"
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "port1"
    next
end
