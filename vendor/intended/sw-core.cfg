!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname sw-core
!
enable secret 5 $1$lab0$abcdefghijklmnopqrstu.
!
username netops privilege 15 secret 5 $1$lab1$abcdefghijklmnopqrstu.
no aaa new-model
!
vtp mode transparent
!
vlan 10
 name HOME
!
vlan 20
 name SERVERS
!
vlan 30
 name DMZ
!
vlan 99
 name MGMT
!
interface GigabitEthernet0/1
 description trunk to fw-edge
 switchport trunk allowed vlan 10,20,30,99
 switchport mode trunk
!
interface GigabitEthernet0/2
 description server rack A
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet0/3
 description server rack B
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet0/4
 description dmz host
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet0/5
 description home lab
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
!
interface Vlan99
 description management SVI
 ip address 192.168.99.2 255.255.255.0
!
ip default-gateway 192.168.99.1
ip ssh version 2
no ip http server
!
logging host 192.168.99.10
snmp-server community lab-ro RO
snmp-server location lab rack 1
ntp server 192.168.99.1
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
